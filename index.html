<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Momentum – Task Manager</title>
<meta name="theme-color" content="#17212B">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
<link rel="stylesheet" href="./styles.css">
<link rel="manifest" href="./manifest.json">
<script src="https://accounts.google.com/gsi/client" async defer></script>

<!-- Google Sign-In Screen (shown when not authenticated) -->
<div id="signinScreen" role="main" aria-label="Momentum sign in" style="display:flex;position:fixed;inset:0;background:var(--bg);z-index:10000;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:48px 32px;">
  <img src="./icon-192.png" width="64" height="64" alt="" style="border-radius:14px;">
  <div style="font-size:26px;font-weight:600;color:var(--text);">Momentum</div>
  <div style="font-size:15px;color:var(--text2);text-align:center;max-width:300px;line-height:1.6;">Sign in with Google to access your tasks</div>
  <button id="googleSignInBtn" onclick="signInWithGoogle()" style="display:flex;align-items:center;gap:12px;padding:14px 28px;border:1px solid var(--border2);border-radius:10px;background:var(--bg);color:var(--text);font-size:16px;font-weight:500;cursor:pointer;font-family:inherit;">
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
    Sign in with Google
  </button>
  <div id="signinError" role="alert" aria-live="assertive" style="font-size:13px;color:#e24b4a;display:none;">Not authorised. Contact your admin to be added to the whitelist.</div>
</div>

<div class="app" id="app" style="visibility:hidden;">
  <div class="toolbar">
    <div id="hintBar" class="hint-bar">
      <span class="kbd">Enter</span> new &nbsp;
      <span class="kbd">⌘↩</span> move/assign &nbsp;
      <span class="kbd">Tab</span> indent &nbsp;
      <span class="kbd">⇧Tab</span> outdent &nbsp;
      <span class="kbd">⌘⇧S</span> section &nbsp;
      <span class="kbd">⌘⇧X</span> today &nbsp;
      <span class="kbd">/</span> search &nbsp;
      <span class="kbd">⌘B/I/U</span> format
    </div>
    <div id="selectBar" style="display:none;align-items:center;gap:4px;flex-shrink:0;">
      <span id="selectCount" style="font-size:11px;color:var(--text2);padding:2px 4px;white-space:nowrap;"></span>
      <button onclick="bulkAssign()" style="font-size:11px;padding:3px 9px;border:0.5px solid var(--border2);border-radius:6px;cursor:pointer;background:var(--bg);color:var(--text);">Assign</button>
      <button onclick="bulkShare()" style="font-size:11px;padding:3px 9px;border:0.5px solid var(--border2);border-radius:6px;cursor:pointer;background:var(--bg);color:var(--text);">Share</button>
      <button onclick="bulkMove()" style="font-size:11px;padding:3px 9px;border:0.5px solid var(--border2);border-radius:6px;cursor:pointer;background:var(--bg);color:var(--text);">Move</button>
      <button onclick="clearSelection();selectionMode=false;" style="font-size:11px;padding:3px 9px;border:0.5px solid var(--border2);border-radius:6px;cursor:pointer;background:var(--bg);color:var(--text2);">✕ Deselect</button>
    </div>
    <button id="userAvatar" onclick="switchUser()" title="Switch user" aria-label="Switch user" style="cursor:pointer;width:28px;height:28px;padding:0;border:none;border-radius:50%;background:var(--text3);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;transition:background 0.3s;">?</button>
    <span class="user-pill" id="userPill" style="display:none;"></span>
    <span class="sync-dot" id="syncDot" style="display:none;"></span>
    <span class="sync-time" id="lastSyncLabel" title="Last successful synchronization">Not synced</span>
    <button onclick="showDataTools()" id="backupBtn" title="Backup, export, or restore tasks" aria-label="Backup and restore"><span class="backup-label">Backup</span><span class="backup-icon" aria-hidden="true">⇩</span></button>
    <button onclick="undo()" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo">↩</button>
    <button onclick="redo()" id="redoBtn" title="Redo (Ctrl+Y)" aria-label="Redo">↪</button>
    <button id="collapseBtn" aria-label="Collapse all projects">Collapse all</button>
    <button id="hideDoneBtn" onclick="toggleHideDone()" title="Toggle visibility of completed tasks" aria-pressed="false">Hide done</button>
    <button onclick="toggleSearch()" id="searchBtn" title="Search (/ or Ctrl+Shift+F)" class="desktop-only">⌕ Search</button>
    <button onclick="claimOwnership()" id="claimBtn" title="Claim ownership of all unowned nodes" style="display:none">⚑ Claim</button>
  </div>
  <div class="search-bar hidden" id="searchBar">
    <span class="search-icon">⌕</span>
    <input class="search-input" id="searchInput" placeholder="Search tasks, sections, projects…" autocomplete="off" spellcheck="false" />
    <span class="search-count" id="searchCount"></span>
    <button class="search-nav-btn" id="searchPrev" title="Previous result (↑)" aria-label="Previous search result">↑</button>
    <button class="search-nav-btn" id="searchNext" title="Next result (↓)" aria-label="Next search result">↓</button>
    <button class="search-clear" id="searchClear" title="Clear search (Esc)" aria-label="Clear search">✕</button>
  </div>
  <div class="tabs" role="tablist" aria-label="Task views">
    <button class="tab active" data-tab="today" role="tab" aria-selected="true">Today</button>
    <button class="tab" data-tab="all" role="tab" aria-selected="false">All tasks</button>
    <button class="tab" data-tab="tree" role="tab" aria-selected="false">Projects</button>
    <button class="tab" data-tab="assigned" role="tab" aria-selected="false">Assigned to me</button>
  </div>
  <div class="today-options" id="todayOptions">
    <label class="today-watch-toggle" title="Include Done &amp; Watch items in Today">
      <input type="checkbox" id="showWatchedTodayToggle" onchange="toggleShowWatchedToday(this.checked)" />
      <span>Show watched</span>
    </label>
  </div>
  <div class="today-options" id="allOptions" style="display:none;">
    <label class="today-watch-toggle" title="Include the Watching section in All Tasks">
      <input type="checkbox" id="showWatchedAllToggle" onchange="toggleShowWatchedAll(this.checked)" />
      <span>Show watched</span>
    </label>
  </div>
  <div id="zoomCrumb" style="display:none;padding:6px 14px;font-size:11px;color:var(--text2);background:var(--bg2);border-bottom:0.5px solid var(--border);flex-shrink:0;"></div>
  <div id="treeEl" class="tree" role="region" aria-label="Tasks" aria-live="polite" aria-busy="true"><div class="empty" role="status">Loading your tasks…</div></div>

  <!-- Keyboard accessory bar — inside flex column, shows above nav when editing -->
  <div class="kb-bar" id="kbBar">
    <button class="kb-btn" id="kbIndent" title="Indent (Tab)">⇥</button>
    <button class="kb-btn" id="kbOutdent" title="Outdent (Shift+Tab)">⇤</button>
    <button class="kb-btn" id="kbUp" title="Move up">↑</button>
    <button class="kb-btn" id="kbDown" title="Move down">↓</button>
    <button class="kb-btn" id="kbToday" title="Schedule today">📅</button>
    <button class="kb-btn kb-btn-wide kb-btn-primary" id="kbDone" title="Done editing">Done</button>
  </div>

  <!-- Mobile bottom navigation — inside .app so it sits in the flex column -->
  <nav class="mobile-nav" id="mobileNav">
    <div class="mobile-nav-inner">
      <button class="mobile-nav-btn active" data-tab="today" id="mnav-today">
        <svg viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><line x1="8" x2="8" y1="14" y2="14"/><line x1="12" x2="12" y1="14" y2="14"/></svg>
        Today
      </button>
      <button class="mobile-nav-btn" data-tab="all" id="mnav-all">
        <svg viewBox="0 0 24 24"><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></svg>
        All tasks
      </button>
      <button class="mobile-nav-btn" data-tab="tree" id="mnav-tree">
        <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        Projects
      </button>
      <button class="mobile-nav-btn" data-tab="assigned" id="mnav-assigned">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Assigned
      </button>
      <button class="mobile-nav-btn" id="mnav-search" onclick="toggleSearch()">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        Search
      </button>
    </div>
  </nav>

  <!-- Mobile FAB — absolute inside .app -->
  <button class="mobile-fab" id="mobileFab" onclick="mobileAddItem()">+</button>
</div>


<script src="./core.js"></script>
<script src="./app.js"></script>
